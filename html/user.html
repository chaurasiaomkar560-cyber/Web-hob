<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEB-HOB | Profile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif}
body{min-height:100vh;background:azure;display:flex;justify-content:center;align-items:center;padding:30px}
.profile-container{width:100%;max-width:700px;background:#fff;border-radius:20px;padding:35px;box-shadow:0 20px 50px rgba(15,23,42,.12);border:1px solid #e5e7eb}
.heading{text-align:center;margin-bottom:30px}
.heading h1{font-size:2rem;color:rgb(190,90,190);margin-bottom:8px}
.heading p{color:#64748b;font-size:.95rem}
.photo-section{display:flex;flex-direction:column;align-items:center;margin-bottom:30px}
.profile-photo{width:150px;height:150px;border-radius:50%;border:4px solid rgb(220,129,220);background:#f3e8f3;display:flex;justify-content:center;align-items:center;overflow:hidden;margin-bottom:15px}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.default-icon{font-size:4rem;color:rgb(190,90,190)}
.photo-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.photo-buttons button{padding:10px 18px;border:none;border-radius:8px;background:rgb(220,129,220);color:#fff;font-size:.9rem;cursor:pointer;transition:.3s}
.photo-buttons button:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(220,129,220,.3)}
.photo-buttons .remove{background:#dc2626}
#photoInput{display:none}
.profile-table{width:100%;border-collapse:collapse;margin-top:10px}
.profile-table th,.profile-table td{padding:15px;border-bottom:1px solid #e5e7eb;text-align:left}
.profile-table th{width:35%;background:#faf5fb;color:#374151}
.profile-table td{color:#64748b}
.logout{width:100%;margin-top:25px;padding:13px;border:none;border-radius:10px;background:#374151;color:#fff;font-size:1rem;cursor:pointer}
.logout:hover{background:#1f2937}
@media(max-width:500px){
body{padding:15px}
.profile-container{padding:25px 20px}
.heading h1{font-size:1.7rem}
.profile-table th,.profile-table td{padding:12px 8px;font-size:.9rem}
.profile-table th{width:40%}
.photo-buttons button{padding:9px 14px}
.profile-photo{width:130px;height:130px}
}
</style>
</head>
<body>

<div class="profile-container">

<div class="heading">
<h1>My Profile</h1>
<p>Manage your WEB-HOB profile information.</p>
</div>

<div class="photo-section">
<div class="profile-photo" id="profilePhoto">
<span class="default-icon">👤</span>
</div>

<div class="photo-buttons">
<button id="choosePhoto">Change Photo</button>
<button class="remove" id="removePhoto">Remove Photo</button>
</div>

<input type="file" id="photoInput" accept="image/*">
</div>

<table class="profile-table">
<tr>
<th>Name</th>
<td id="userName"></td>
</tr>

<tr>
<th>Email</th>
<td id="userEmail"></td>
</tr>

<tr>
<th>Password</th>
<td id="userPassword">********</td>
</tr>

<tr>
<th>Gender</th>
<td id="userGender"></td>
</tr>

<tr>
<th>Age</th>
<td id="userAge"></td>
</tr>
</table>

<button class="logout" id="logout">Logout</button>

</div>

<script>
let currentUser=JSON.parse(localStorage.getItem("currentUser"));

if(!currentUser){
window.location.href="login.html";
}else{

document.querySelector("#userName").textContent=currentUser.name;
document.querySelector("#userEmail").textContent=currentUser.email;
document.querySelector("#userPassword").textContent="********";
document.querySelector("#userGender").textContent=currentUser.gender;
document.querySelector("#userAge").textContent=currentUser.age;

let profilePhoto=document.querySelector("#profilePhoto");
let photoInput=document.querySelector("#photoInput");
let choosePhoto=document.querySelector("#choosePhoto");
let removePhoto=document.querySelector("#removePhoto");

let photoKey="profilePhoto_"+currentUser.email.toLowerCase();

let savedPhoto=localStorage.getItem(photoKey);

if(savedPhoto){
profilePhoto.innerHTML='<img src="'+savedPhoto+'" alt="Profile Photo">';
}

choosePhoto.addEventListener("click",function(){
photoInput.click();
});

photoInput.addEventListener("change",function(){

let file=photoInput.files[0];

if(!file){
return;
}

if(!file.type.startsWith("image/")){
return;
}

let reader=new FileReader();

reader.onload=function(event){

let photo=event.target.result;

profilePhoto.innerHTML='<img src="'+photo+'" alt="Profile Photo">';

localStorage.setItem(photoKey,photo);
};

reader.readAsDataURL(file);
});

removePhoto.addEventListener("click",function(){

localStorage.removeItem(photoKey);

profilePhoto.innerHTML='<span class="default-icon">👤</span>';

photoInput.value="";
});

document.querySelector("#logout").addEventListener("click",function(){

localStorage.removeItem("currentUser");

window.location.href="login.html";

});
}
</script>

</body>
</html>
